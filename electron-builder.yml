appId: gg.crabhost.app
productName: Crab Host
copyright: Copyright © 2026 Crab Host
directories:
  buildResources: build
  output: release
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Crab Host
  artifactName: CrabHost-Setup-${version}.${ext}
portable:
  artifactName: CrabHost-${version}-portable.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.utilities
  target: [dmg]
  artifactName: CrabHost-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  category: Utility
  target: [AppImage]
  artifactName: CrabHost-${version}-${arch}.${ext}
publish:
  provider: github
  owner: peytonthegoaty
  repo: Minecraft-Hosting
  releaseType: release
